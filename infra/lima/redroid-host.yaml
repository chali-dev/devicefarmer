# Local Linux host for running redroid during development on macOS.
# Docker Desktop's kernel has no binder, so Android containers run here.
# Usage: limactl start --name=redroid infra/lima/redroid-host.yaml
vmType: vz
cpus: 4
memory: 4GiB
disk: 40GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts: []
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y "linux-modules-extra-$(uname -r)" || true
      command -v docker || curl -fsSL https://get.docker.com | sh
      usermod -aG docker "{{.User}}"
      echo binder_linux > /etc/modules-load.d/redroid.conf
      echo 'options binder_linux devices="binder,hwbinder,vndbinder"' > /etc/modprobe.d/redroid.conf
      modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
probes:
  - script: |
      #!/bin/bash
      set -eux
      timeout 300 bash -c 'until command -v docker >/dev/null; do sleep 3; done'
portForwards:
  # Docker Engine API for the control plane, as a host-only unix socket
  # (no TCP exposure): ~/.lima/redroid/sock/docker.sock
  - guestSocket: "/var/run/docker.sock"
    hostSocket: "{{.Dir}}/sock/docker.sock"
  - guestPortRange: [1, 65535]
    hostIP: "127.0.0.1"
